[package]
name = "ssh-ui-lazy"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
keyring = "4.2.0"
rand = "0.8"
regex = "1.13.2"
russh = { version = "0.65.2", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
zeroize = "1.9.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
